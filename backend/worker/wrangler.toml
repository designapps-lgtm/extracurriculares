name = "extracurriculares-api"
main = "./worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

# Secretos server-only (configurar con `wrangler secret put`):
# JWT_SECRET, GOOGLE_CLIENT_ID, APPSHEET_APPLICATION_ACCESS_KEY y, si se usan,
# GOOGLE_SERVICE_ACCOUNT_JSON / GOOGLE_DRIVE_FOLDER_ID / GOOGLE_DRIVE_WEBHOOK_TOKEN.
[vars]
NODE_ENV = "production"
PORT = "3000"
FRONTEND_URL = "https://extracurriculares-mu.vercel.app/"
ACCESS_TOKEN_EXPIRES_IN = "15m"
SESSION_DURATION_HOURS = "168"
GOOGLE_INSTITUTION_DOMAIN = "gi.edu.co"
APPSHEET_APP_ID = "0a43ca9a-ff5b-47bf-8127-8f14f1150ff0"
APPSHEET_DEMOGRAFICOS_TABLE = "Demograficos"
# APPSHEET_NOVEDADES_TABLE se omite hasta identificar una tabla real.
# El rate limiting del Worker se configura en Cloudflare, no con MemoryStore de Express.
