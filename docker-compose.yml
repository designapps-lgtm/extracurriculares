services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      SESSION_DURATION_HOURS: ${SESSION_DURATION_HOURS:-168}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_INSTITUTION_DOMAIN: ${GOOGLE_INSTITUTION_DOMAIN:-gi.edu.co}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_WEBHOOK_URL: ${GOOGLE_DRIVE_WEBHOOK_URL:-}
      GOOGLE_DRIVE_WEBHOOK_TOKEN: ${GOOGLE_DRIVE_WEBHOOK_TOKEN:-}
      APPSHEET_APP_ID: ${APPSHEET_APP_ID:-}
      APPSHEET_APPLICATION_ACCESS_KEY: ${APPSHEET_APPLICATION_ACCESS_KEY:-}
      APPSHEET_DEMOGRAFICOS_TABLE: ${APPSHEET_DEMOGRAFICOS_TABLE:-Demograficos}
      APPSHEET_NOVEDADES_TABLE: ${APPSHEET_NOVEDADES_TABLE:-}
      APPSHEET_WEBHOOK_TOKEN: ${APPSHEET_WEBHOOK_TOKEN:-}
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
